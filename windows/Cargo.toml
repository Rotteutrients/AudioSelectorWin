[package]
name = "audio-selector"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
windows = { version = "=0.62.2", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Rfcomm",
    "Foundation",
    "Networking",
    "Networking_Sockets",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Devices_Bluetooth",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "=0.62.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
