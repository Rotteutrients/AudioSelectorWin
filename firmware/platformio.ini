[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@7.0.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv

lib_deps =
    lovyan03/LovyanGFX@1.2.29

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17

build_unflags =
    -std=gnu++11
